<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ShalaKasi</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B0D10'/%3E%3Ctext x='32' y='45' font-family='Arial, sans-serif' font-size='38' font-weight='bold' fill='%23F7931A' text-anchor='middle'%3E%E2%82%BF%3C/text%3E%3C/svg%3E">
</head>
<body>

<div class="login-screen" id="login-screen">
  <div class="login-card">
    <div class="login-logo">SK</div>
    <h1>ShalaKasi</h1>
    <p class="sub">Bitcoin Ekasi &middot; Diploma workstation login</p>
    <div class="field">
      <label>Username</label>
      <input type="text" id="login-username" autocomplete="off">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="login-password">
    </div>
    <button class="login-btn" id="login-submit">Log in</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<div class="app" id="app">
  <div class="rail">
    <div class="rail-logo">SK</div>
    <div class="rail-nav">
      <button class="rail-btn active" data-view="course">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H12v16H5.5C4.7 20 4 19.3 4 18.5v-13Z"/><path d="M20 5.5c0-.8-.7-1.5-1.5-1.5H12v16h6.5c.8 0 1.5-.7 1.5-1.5v-13Z"/></svg>
        <span>Course</span>
      </button>
      <button class="rail-btn" data-view="book">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg>
        <span>Book</span>
      </button>
      <button class="rail-btn" data-view="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6" cy="6" r="2.2"/><circle cx="18" cy="6" r="2.2"/><circle cx="12" cy="13" r="2.2"/><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="19" r="2.2"/><path d="M7.8 7.2 10.3 11.4M16.2 7.2 13.7 11.4M11 15 7.6 17.3M13 15l3.4 2.3"/></svg>
        <span>Progress</span>
      </button>
      <button class="rail-btn" data-view="live">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2 L12 8 M12 16 L12 22 M2 12 L8 12 M16 12 L22 12"/><circle cx="12" cy="12" r="3.5"/></svg>
        <span>Live</span>
      </button>
    </div>
    <div class="rail-logout" id="logout-btn" title="Log out">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-title" id="topbar-title">Loading…</div>
      <div class="topbar-right">
        <div class="price-ticker" id="price-ticker"></div>
        <div class="topbar-title" id="student-name" style="color:var(--text-faint); font-size:12px;"></div>
      </div>
    </div>

    <div class="view active" id="view-course">
      <div class="course-wrap" id="course-content">
        <p class="body-text">Loading your next section…</p>
      </div>
    </div>

    <div class="view" id="view-book">
      <div class="book-wrap" id="book-content">
        <p class="body-text">Loading the full Bitcoin Diploma…</p>
      </div>
    </div>

    <div class="view" id="view-dashboard">
      <div class="dash-wrap" id="dashboard-content">
        <h1 class="dash-title">Your progress</h1>
        <p class="dash-sub">Loading…</p>
      </div>
    </div>

    <div class="view" id="view-live">
      <div class="live-wrap" id="live-content">
        <p class="body-text">Connecting to the Bitcoin network…</p>
      </div>
    </div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
